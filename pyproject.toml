[project]
name = "mcmc"
version = "0.1.0"
description = "Experiments for MCMC Can See Can't See"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Daniel Matsui Smola"}]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "mpmath>=1.3",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "arviz>=0.18",
    "pytest>=8.0",
]

[project.optional-dependencies]
sampling = [
    "jax>=0.4.30",
    "numpyro>=0.15",
]
dev = [
    "ruff>=0.4",
    "ipython>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcmc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
